<html lang="en">

<head>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no" />    
    <link rel="stylesheet" href="assets/css/app.css" type="text/css" />    
    <title>
        Basketball Legends
    </title>
    
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"> 
</head>

<body>
    <div id="content"></div>
    <div id="loader">Loading ...</div>
    
   \
    <script type="text/javascript" src="assets/lib/nape.min.js">
        var nape = "nape.min.js";
    </script>
    <script type="text/javascript" src="assets/lib/jquery-3.1.1.min.js"></script>
    <script type="text/javascript" src="assets/lib/easeljs-0.8.2.combined.js"></script>
    <script type="text/javascript" src="assets/lib/phaser.min.js"></script>
    <script type="text/javascript" src="assets/lib/phaser-cachebuster.min.js"></script>
    <script type="text/javascript" src="assets/lib/phaser-super-storage.min.js"></script>
    <script type="text/javascript" src="assets/lib/dragonBones.min.js"></script> 
  <div id="timeMenu"
style="
display:none;
position:fixed;
bottom:40px;
left:50%;
transform:translateX(-50%);
z-index:9999;
background:rgba(20,20,40,.9);
color:white;
padding:10px 15px;
border-radius:12px;
font-family:Arial;
font-size:18px;
box-shadow:0 0 10px rgba(0,0,0,.5);">

    <div style="display:flex;align-items:center;gap:10px;">
        ⏱ Time:

        <input
            id="matchTime"
            type="range"
            min="5"
            max="180"
            value="60"
            step="5"
            oninput="timeValue.innerText=this.value + 's'"
        >

        <span id="timeValue">60s</span>
    </div>

    <div style="margin-top:10px;">
        🌍 Gravity:

        <select id="gravityMode">
            <option value="700">🪐Saturn</option>
            <option value="450" selected>🌏Normal</option>
            <option value="300">🌖Moon</option>
        </select>
    </div>
    <div style="margin-top:10px;">


👤 Player Size:

<select id="playerSize">
    <option value="0.5">Small</option>
    <option value="0.73" selected>Normal</option>
    <option value="1.2">Big</option>
    <option value="chaos">Invisible</option>
</select>
</div>
<div style="margin-top:10px;">



🐢 Game Speed:
<select id="gameSpeed">
    <option value="2">Fast</option>
    <option value="1" selected>Normal</option>
    <option value="0.4">Slow</option>
</select>
</div>


</div>
<script type="text/javascript" src="basketball_legends_2019.min.js?93fa17140190de6bc063"></script></body>
